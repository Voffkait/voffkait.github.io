<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кино и общество: 1950–2026</title>
<style>
:root{--bg:#0d0b0a;--fg:#f3ece0;--mut:#a89d8c;--ac:#e0a93b;--pn:#1b1714;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 80% -10%,#3a2a12 0,transparent 60%),var(--bg);color:var(--fg);font:17px/1.5 Georgia,'Times New Roman',serif;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
#bar{position:fixed;left:0;top:0;height:4px;background:var(--ac);transition:width .6s;z-index:5}
.sl{position:absolute;inset:0;padding:5vh 5vw 11vh;display:grid;grid-template-columns:1fr 1.1fr;gap:3vw;align-items:center;opacity:0;pointer-events:none;transform:translateX(60px) scale(.98);transition:opacity .7s,transform .7s;overflow:auto}
.sl.on{opacity:1;pointer-events:auto;transform:none}.sl.out{transform:translateX(-60px) scale(.98)}
.yr{font:700 clamp(56px,10vw,140px)/1 Georgia,serif;color:transparent;-webkit-text-stroke:1.5px var(--ac)}
h2{margin:.1em 0 .4em;font-size:clamp(26px,3.8vw,46px);line-height:1.1}
ul{padding:0;list-style:none;margin:0}
li{padding:8px 0 8px 20px;border-left:2px solid var(--ac);margin:10px 0;background:linear-gradient(90deg,#ffffff0a,transparent);opacity:0;transform:translateY(14px);transition:.6s}
.on li{opacity:1;transform:none}.on li:nth-child(2){transition-delay:.25s}.on li:nth-child(3){transition-delay:.5s}
.fs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fm{aspect-ratio:3/4;border-radius:14px;background:var(--pn);border:2px solid #e0a93b66;position:relative;overflow:hidden;cursor:pointer;perspective:800px;transition:transform .3s,border-color .3s}
.fm:hover{transform:translateY(-4px);border-color:var(--ac)}
.fm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fr,.bk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;transition:opacity .6s,transform .6s}
.fr{color:var(--mut);font-size:15px;background:linear-gradient(#0000,#000a)}
.fr .q{font:700 64px/1 Georgia;color:var(--ac)}
.bk{opacity:0;transform:scale(.92);background:#000d;font-size:14px;line-height:1.4}
.bk b{display:block;font-size:20px;color:var(--ac);line-height:1.2}.bk i{color:var(--mut);font-style:normal;margin:4px 0 8px}
.fm.rv .fr{opacity:0;transform:scale(1.08)}.fm.rv .bk{opacity:1;transform:none}
.up{position:absolute;right:6px;top:6px;z-index:3;padding:3px 9px;font-size:13px}
button{background:var(--pn);color:var(--fg);border:1px solid #e0a93b66;border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
button:hover{background:var(--ac);color:#111}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));z-index:7}
#tm{font:14px monospace;color:var(--ac);min-width:92px;text-align:center;cursor:pointer}
#eb{position:fixed;right:12px;top:12px;z-index:8;background:var(--ac);color:#111;border-radius:8px;padding:5px 10px;font:13px sans-serif;display:none}
.ed #eb{display:block}.ed [contenteditable]{outline:1px dashed #e0a93b99;outline-offset:3px;cursor:text}
.cover{grid-template-columns:1fr;text-align:center}.cover .yr{font-size:clamp(40px,8vw,110px)}
@media(max-width:800px){.sl{grid-template-columns:1fr;align-content:start}body{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="bar"></div><div id="app"></div><div id="eb">РЕЖИМ РЕДАКТИРОВАНИЯ · Ctrl+E или Esc — выйти и сохранить</div>
<div id="ui"><button id="pv">←</button><button id="nx">→</button></div>
<script>
// f: [подсказка для угадывания, название, год, информация]
const D=[
{y:"1950–2026",t:"Как кино меняло нас: от ТВ до ИИ",b:["Три четверти века кино","Технологии и общество","Мировое и советское кино"],c:1},
{y:"1950-е",t:"Битва с телевидением",b:["Широкий экран, цвет, 3D","Куросава и Бергман","СССР: оттепель"],f:[["Гонка колесниц на огромной арене","Бен-Гур","1959","Уильям Уайлер. 11 «Оскаров». Ответ студий на телевидение: масштаб и цвет."],["Вальс, берёзы и ожидание с фронта","Летят журавли","1957","Михаил Калатозов. Золотая пальмовая ветвь в Канне, символ оттепели."]]},
{y:"1960-е",t:"Новые волны и бунт",b:["Годар и Трюффо ломают монтаж","Тарковский дебютирует","Конец кодекса Хейса"],f:[["Парижские улицы, сигарета и погоня","На последнем дыхании","1960","Жан-Люк Годар. Манифест французской новой волны, рваный монтаж."],["Мальчик-разведчик, война и сны","Иваново детство","1962","Андрей Тарковский. «Золотой лев» Венеции."]]},
{y:"1970-е",t:"Новый Голливуд и блокбастер",b:["Мрачные драмы режиссёров","Рождение летнего блокбастера","Dolby и Steadicam"],f:[["Две ноты музыки и плавник в воде","Челюсти","1975","Стивен Спилберг. Первый летний блокбастер."],["Двойной закат над пустыней","Звёздные войны","1977","Джордж Лукас. Начало эры мерчандайзинга."]]},
{y:"1980-е",t:"Видеокассеты и герои-одиночки",b:["VHS и видеосалоны","Боевики и подростковое кино","Перестройка в СССР"],f:[["Дождливый неон и «слёзы под дождём»","Бегущий по лезвию","1982","Ридли Скотт. Киберпанк и вопрос: что значит быть человеком."],["Дорога к храму и вопрос совести","Покаяние","1984","Тенгиз Абуладзе. Вышел в 1987, фильм-взрыв перестройки."]]},
{y:"1990-е",t:"Цифра и независимое кино",b:["CGI меняет зрелище","Тарантино и инди","Страх перед цифровым миром"],f:[["Танец под рок-н-ролл и чемоданчик","Криминальное чтиво","1994","Квентин Тарантино. Золотая пальмовая ветвь, нелинейный сюжет."],["Красная и синяя таблетки","Матрица","1999","Вачовски. Кино о цифровой реальности и свободе."]]},
{y:"2000-е",t:"Франшизы и мир после 11 сентября",b:["Киновселенные","Motion capture и 3D","Эскапизм и паранойя"],f:[["Хоббит с кольцом и далёкая гора","Властелин колец: Братство Кольца","2001","Питер Джексон. Эпос как эскапизм после 11 сентября."],["Клоун в полицейской машине","Тёмный рыцарь","2008","Кристофер Нолан. Посмертный «Оскар» Хита Леджера."]]},
{y:"2010-е",t:"Стриминг и золотой век сериалов",b:["Netflix и Кинопоиск","Разнообразие и #MeToo","Глобальные вкусы"],f:[["Семья в полуподвале и дом на холме","Паразиты","2019","Пон Джун Хо. Первый неанглоязычный фильм — лучший фильм «Оскара»."],["Чёрно-белая Мексика 70-х","Рома","2018","Альфонсо Куарон. Netflix-фильм, ставший событием."]]},
{y:"2020–2026",t:"Пандемия, ИИ и «Барбенгеймер»",b:["Окна проката сокращены","Зритель идёт на события","ИИ в кино и споры вокруг"],f:[["Розовый мир и кукла в машине","Барби","2023","Грета Гервиг. Вместе с «Оппенгеймером» вернула людей в кино."],["Взрыв, тишина и чёрно-белые вспышки","Оппенгеймер","2023","Кристофер Нолан. 7 «Оскаров»."]]},
{y:"Итог",t:"Кино — зеркало и двигатель",b:["Технологии меняют форму","Общество меняет темы","Алгоритмы дробят зрителей"],c:1}];
const K='kino_v2',app=document.getElementById('app');
let sv=null;try{sv=JSON.parse(localStorage.getItem(K))}catch(e){}
D.forEach((d,n)=>{const s=document.createElement('section');s.className='sl'+(d.c?' cover':'');
const fs=d.f?`<div class="fs">${d.f.map((f,j)=>`<div class="fm"><button class="up">🖼</button><div class="fr"><div class="q">?</div><span data-k="h${j}">${f[0]}</span><small>нажмите, чтобы узнать</small></div><div class="bk"><b data-k="n${j}">${f[1]}</b><i data-k="a${j}">${f[2]}</i><span data-k="d${j}">${f[3]}</span></div></div>`).join('')}</div>`:'';
s.innerHTML=`<div><div class="yr" data-k="y">${d.y}</div><h2 data-k="t">${d.t}</h2><ul>${d.b.map((x,j)=>`<li data-k="b${j}">${x}</li>`).join('')}</ul></div>${fs}`;
if(sv&&sv[n])s.querySelectorAll('[data-k]').forEach(e=>{const v=sv[n][e.dataset.k];if(v!=null)e.innerHTML=v});
s.querySelectorAll('.fm').forEach(m=>{m.onclick=e=>{if(!ed&&!e.target.closest('.up'))m.classList.toggle('rv')};
m.querySelector('.up').onclick=e=>{e.stopPropagation();const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const r=new FileReader();r.onload=()=>{let im=m.querySelector('img');if(!im){im=document.createElement('img');m.prepend(im)}im.src=r.result};f.files[0]&&r.readAsDataURL(f.files[0])};f.click()}});
app.appendChild(s)});
const S=[...document.querySelectorAll('.sl')];let c=0,ed=false;
function go(n){n=Math.max(0,Math.min(S.length-1,n));S.forEach((s,i)=>{s.classList.toggle('on',i==n);s.classList.toggle('out',i<n)});c=n;document.getElementById('bar').style.width=((n+1)/S.length*100)+'%'}
function toggleEdit(){ed=!ed;document.body.classList.toggle('ed',ed);S.forEach(s=>s.querySelectorAll('[data-k]').forEach(x=>x.contentEditable=ed));
if(!ed){const o=S.map(s=>{const r={};s.querySelectorAll('[data-k]').forEach(x=>r[x.dataset.k]=x.innerHTML);return r});try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}}}
pv.onclick=()=>go(c-1);nx.onclick=()=>go(c+1);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.code==='KeyE'){e.preventDefault();toggleEdit();return}
if(ed){if(e.key==='Escape')toggleEdit();return}
if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(c+1)}if(['ArrowLeft','PageUp'].includes(e.key))go(c-1);
if(e.key==='Enter'){const m=S[c].querySelectorAll('.fm');const h=[...m].find(x=>!x.classList.contains('rv'));if(h)h.classList.add('rv');else m.forEach(x=>x.classList.remove('rv'))}});
go(0);
</script></body></html>
